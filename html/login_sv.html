<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../css/login_sv.css" />

    <!-- Acessibilidade e alertas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget("https://vlibras.gov.br/app");
    </script>

    <style>
      /* estilo só para organizar checkbox e texto na mesma linha */
      .mostrar-senha {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.9rem;
        cursor: pointer;
        user-select: none;
        margin-top: 5px;
      }
      .mostrar-senha input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <header>
      <a class="logo_link" href="../index.html">
        <img
          class="logo_sv"
          src="https://i.ibb.co/HfXr8qQ2/logo-nova-SV-removebg-preview.png"
          alt="logo da empresa"
        />
        <h1 class="logo_nome">Sentimentos em Versos</h1>
      </a>
      <nav>
        <a class="cadastrolink" href="cadastro.html">CADASTRO</a>
        <button class="nao_login" onclick="confirmar()">
          CONTINUAR SEM LOGIN
        </button>
      </nav>
    </header>

    <main>
      <section class="organizar">
        <div class="container">
          <h1 class="facalogin">Login</h1>

          <h1 class="Esqueceu">
            Não tem uma conta?
            <span class="Cadastre-se">
              <a class="Cadastre-se" href="cadastro.html">Cadastre-se</a>
            </span>
          </h1>

          <form id="loginForm"  action="../php/login.php" method="POST">
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              required
            />

            <input
              type="password"
              name="senha"
              id="password"
              placeholder="Senha"
              required
            />

            <!-- Checkbox alinhado com o texto -->
            <label class="mostrar-senha">
              <input
                type="checkbox"
                id="show-password"
                onclick="toggleSenha('password','show-password')"
              />
              <span>Mostrar Senha</span>
            </label>

            <br />
            <button class="botoes" type="submit">Login</button>

            <a class="Esqueceu" href="Pag_nao.html">
              <h1 class="Esqueceu2">Esqueceu a senha?</h1>
            </a>
          </form>
        </div>
      </section>
    </main>

    <script>

  // Mostrar / ocultar senha
  function toggleSenha(campoId, checkboxId) {
    const campo = document.getElementById(campoId);
    const checkbox = document.getElementById(checkboxId);
    if (!campo) return;
    campo.type = checkbox.checked ? "text" : "password";
  }

  // Confirmação para continuar sem login
  function confirmar() {
    Swal.fire({
      title: "Atenção!",
      text: "Ao continuar sem login, vários recursos estarão desabilitados. Deseja continuar?",
      icon: "warning",
      showCancelButton: true,
      confirmButtonText: "Sim, continuar",
      cancelButtonText: "Cancelar",
      confirmButtonColor: "#3085d6",
      cancelButtonColor: "#d33",
    }).then((result) => {
      if (result.isConfirmed) {
        window.location.href = "../index.html";
      }
    });
  }

  // Validação e envio do formulário via AJAX
  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault(); // previne envio automático

    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("password").value.trim();

    if (!email || !senha) {
      Swal.fire({
        icon: "error",
        title: "Campos obrigatórios",
        text: "Por favor, preencha seu email e senha."
      });
      return;
    }

    // Cria objeto FormData
    const formData = new FormData(this);

    // Envia para login.php
    fetch("../php/login.php", {
      method: "POST",
      body: formData
    })
    .then(response => response.text())
    .then(data => {
      // Verifica resposta do PHP
      if (data === "success") {
        Swal.fire({
          icon: "success",
          title: "Login realizado",
          text: "Bem-vindo de volta!"
        }).then(() => {
          window.location.href = "Pag_nao.html";
        });
      } else {
        Swal.fire({
          icon: "error",
          title: "Login falhou",
          text: data // mensagem retornada pelo PHP
        });
      }
    })
    .catch(error => {
      console.error("Erro no envio:", error);
      Swal.fire({
        icon: "error",
        title: "Erro",
        text: "Ocorreu um erro ao tentar fazer login. Tente novamente."
      });
    });
  });


    </script>
  </body>
</html>
