<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CADASTRO</title>
    <link rel="stylesheet" href="../css/cadastro.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget("https://vlibras.gov.br/app");
    </script>
    <style>
      /* pequenas melhorias visuais para facilitar testes */
      .mostrar { margin-left: 6px; font-size: 0.9rem; }
      input { display:block; margin:8px 0; padding:8px; width:100%; max-width:360px; box-sizing:border-box;}
      .botoes { padding:10px 16px; cursor:pointer; }
    </style>
  </head>

  <body>
    <header>
      <a class="logo_link" href="../index.html">
        <img
          class="logo_sv"
          src="https://i.ibb.co/HfXr8qQ2/logo-nova-SV-removebg-preview.png"
          alt="logo da empresa"
        />
        <h1 class="logo_nome">Sentimentos em Versos</h1>
      </a>
      <nav>
        <a class="loginlink" href="login_sv.html">LOGIN</a>
        <button class="nao_login" onclick="confirmar()">CONTINUAR SEM LOGIN</button>
      </nav>
    </header>

    <main>
      <section class="organizar">
        <div class="container">
          <div class="lado_esquerdo">
            <h1 class="facacadastro">Cadastro</h1>

            <!-- FORMULÁRIO UNIFICADO -->
            <form id="loginForm"  action="../php/cadastrar.php" method="POST">
              <input type="text" id="nome" name="nome" placeholder="Nome Completo" required />

             <input
  type="tel"
  id="telefone"
  name="telefone"
  placeholder="(DDD) 9XXXX-XXXX"
  maxlength="15"
  required
  oninput="formatarTelefone(this)"
/>

              <input type="email" id="email" name="email" placeholder="Email" required />

             <!-- Campo para criar senha -->
<input
  type="password"
  name="senha"
  id="senha"
  placeholder="Criar Senha"
  required
/>
<label class="mostrar-senha">
  <input
    type="checkbox"
    id="show-senha"
    onclick="toggleSenha('senha', 'show-senha')"
  />
  <span>Mostrar Senha</span>
</label>

<!-- Campo para confirmar senha -->
<input
  type="password"
  name="confirmar_senha"
  id="confirmar"
  placeholder="Confirmar Senha"
  required
/>
<label class="mostrar-senha">
  <input
    type="checkbox"
    id="show-confirmar"
    onclick="toggleSenha('confirmar', 'show-confirmar')"
  />
  <span>Mostrar Senha</span>
</label>

              <br />
              <button class="botoes" type="submit">Cadastrar</button>

              <h1 class="Esqueceu">
                Já tem uma conta?
                <span class="paralogin"><a class="paralogin" href="login_sv.html">Faça login</a></span>
              </h1>
            </form>

          </div>
        </div>
      </section>
    </main>

    <!-- SCRIPTS -->
    <script>
  // Mostrar / ocultar senha (funciona para qualquer campo passado)
  function toggleSenha(campoId, checkboxId) {
    const campo = document.getElementById(campoId);
    const checkbox = document.getElementById(checkboxId);
    if (!campo) return;
    campo.type = checkbox.checked ? "text" : "password";
  }

  // Formatação de telefone
  function formatarTelefone(input) {
    let valor = input.value.replace(/\D/g, ""); // remove tudo que não for número

    if (valor.length > 11) valor = valor.slice(0, 11);

    if (valor.length > 6) {
      input.value = valor.replace(/^(\d{2})(\d{5})(\d{0,4}).*/, "($1) $2-$3");
    } else if (valor.length > 2) {
      input.value = valor.replace(/^(\d{2})(\d{0,5})/, "($1) $2");
    } else {
      input.value = input.value.replace(/^(\d*)/, "($1");
    }
  }

  // Confirmação "continuar sem login"
  function confirmar() {
    Swal.fire({
      title: "Atenção!",
      text: "Ao continuar sem login, vários recursos estarão desabilitados. Você deseja continuar?",
      icon: "warning",
      showCancelButton: true,
      confirmButtonText: "Sim, continuar",
      cancelButtonText: "Cancelar",
      confirmButtonColor: "#3085d6",
      cancelButtonColor: "#d33",
    }).then((result) => {
      if (result.isConfirmed) {
        window.location.href = "../index.html";
      }
    });
  }

  // Validação e envio do formulário via AJAX
  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault(); // previne envio automático

    const nome = document.getElementById("nome").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const confirmar = document.getElementById("confirmar").value;

    // validações básicas
    if (!nome || !telefone || !email || !senha || !confirmar) {
      Swal.fire({
        icon: "error",
        title: "Campos faltando",
        text: "Por favor preencha todos os campos obrigatórios."
      });
      return;
    }

    if (senha !== confirmar) {
      Swal.fire({
        icon: "error",
        title: "Senhas diferentes",
        text: "As senhas não coincidem. Tente novamente."
      });
      return;
    }

    // Se tudo certo, cria objeto FormData e envia via AJAX
    const formData = new FormData(this);

    fetch("../php/cadastrar.php", {
      method: "POST",
      body: formData
    })
    .then(response => response.text())
    .then(data => {
      // mostra SweetAlert de sucesso com resposta do PHP
      Swal.fire({
        icon: "success",
        title: "Cadastro realizado",
        text: "Seu cadastro foi salvo com sucesso!"
      }).then(() => {
        // redireciona para página final
        window.location.href = "Pag_nao.html";
      });
    })
    .catch(error => {
      console.error("Erro no envio:", error);
      Swal.fire({
        icon: "error",
        title: "Erro",
        text: "Ocorreu um erro ao enviar os dados. Tente novamente."
      });
    });
  });
</script>

    </script>
  </body>
</html>
